{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<h1 class="page-title"><i class="bi bi-file-earmark-bar-graph text-success me-2"></i> Reports & export</h1>
<div class="row g-3">
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex align-items-center mb-3">
          <div class="rounded-3 bg-danger bg-opacity-10 text-danger p-2 me-3">
            <i class="bi bi-file-pdf" style="font-size:1.5rem"></i>
          </div>
          <h5 class="mb-0 fw-bold">PDF</h5>
        </div>
        <a href="{% url 'reports:export_collections_pdf' %}" class="btn btn-outline-primary">
          <i class="bi bi-download me-1"></i> Collections report
        </a>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex align-items-center mb-3">
          <div class="rounded-3 bg-success bg-opacity-10 text-success p-2 me-3">
            <i class="bi bi-file-earmark-excel" style="font-size:1.5rem"></i>
          </div>
          <h5 class="mb-0 fw-bold">Excel</h5>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <a href="{% url 'reports:export_billing_excel' %}" class="btn btn-outline-success"><i class="bi bi-download me-1"></i> Billing</a>
          <a href="{% url 'reports:export_incidents_excel' %}" class="btn btn-outline-success"><i class="bi bi-download me-1"></i> Incidents</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
