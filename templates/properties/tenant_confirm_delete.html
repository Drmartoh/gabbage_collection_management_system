{% extends "base.html" %}
{% block title %}Delete Tenant{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card border-danger"><div class="card-body text-center p-4">
    <div class="text-danger mb-3"><i class="bi bi-exclamation-triangle display-4"></i></div>
    <h4 class="fw-bold">Remove Tenant</h4>
    <p class="text-muted">Remove <strong>{{ tenant.full_name }}</strong> from {{ tenant.property.name }}? This will affect billing (one fewer unit).</p>
    <form method="post">{% csrf_token %}
      <div class="d-flex gap-2 justify-content-center">
        <button type="submit" class="btn btn-danger">Yes, remove</button>
        <a href="{% url 'properties:property_detail' tenant.property_id %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
