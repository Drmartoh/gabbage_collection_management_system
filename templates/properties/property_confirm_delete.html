{% extends "base.html" %}
{% block title %}Delete Property{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card border-danger"><div class="card-body text-center p-4">
    <div class="text-danger mb-3"><i class="bi bi-exclamation-triangle display-4"></i></div>
    <h4 class="fw-bold">Delete Property</h4>
    <p class="text-muted">Delete {{ property_obj.name }}? All tenants will be deleted.</p>
    <form method="post">{% csrf_token %}
      <div class="d-flex gap-2 justify-content-center">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'properties:landlord_detail' property_obj.landlord_id %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
