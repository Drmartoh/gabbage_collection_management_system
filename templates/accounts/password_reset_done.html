{% extends "base.html" %}
{% block title %}Reset email sent{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-11 col-sm-10 col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body p-4 p-sm-5 text-center">
        <i class="bi bi-envelope-check text-success" style="font-size:3rem"></i>
        <h5 class="fw-bold mt-3">Check your email</h5>
        <p class="text-muted mb-0">If an account exists for that email, we’ve sent a password reset link. It may take a few minutes to arrive.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-4">Back to sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
