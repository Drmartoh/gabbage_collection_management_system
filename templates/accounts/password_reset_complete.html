{% extends "base.html" %}
{% block title %}Password reset complete{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-11 col-sm-10 col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body p-4 p-sm-5 text-center">
        <i class="bi bi-check-circle text-success" style="font-size:3rem"></i>
        <h5 class="fw-bold mt-3">Password reset complete</h5>
        <p class="text-muted mb-0">You can now sign in with your new password.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-4">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
