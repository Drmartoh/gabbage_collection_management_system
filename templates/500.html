{% extends "base.html" %}
{% block title %}Server error{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-11 col-md-8 col-lg-6 text-center">
    <div class="card">
      <div class="card-body p-5">
        <i class="bi bi-gear text-muted" style="font-size:4rem"></i>
        <h1 class="h3 fw-bold mt-3">Something went wrong</h1>
        <p class="text-muted mb-4">We’re sorry. An error occurred. Please try again or contact support.</p>
        <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-primary">Go to dashboard</a>
        <a href="javascript:location.reload()" class="btn btn-outline-secondary ms-2">Reload page</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
