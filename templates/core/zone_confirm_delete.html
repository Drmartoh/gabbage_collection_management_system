{% extends "base.html" %}
{% block title %}Delete Zone{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card border-danger"><div class="card-body text-center p-4">
    <div class="text-danger mb-3"><i class="bi bi-exclamation-triangle display-4"></i></div>
    <h4 class="fw-bold">Delete Zone</h4>
    <p class="text-muted">Delete <strong>{{ zone.name }}</strong> ({{ zone.ward.name }})? All routes in this zone will also be deleted.</p>
    <form method="post">{% csrf_token %}
      <div class="d-flex gap-2 justify-content-center">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'core:zone_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
