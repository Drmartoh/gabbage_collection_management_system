{% extends "base.html" %}
{% block title %}{% if object %}Edit Cart{% else %}Add Cart{% endif %}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
  <h1 class="page-title mb-0"><i class="bi bi-basket text-primary me-2"></i> {% if object %}Edit Cart{% else %}Add Cart{% endif %}</h1>
  <a href="{% url 'core:cart_list' %}" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-1"></i> Back to list</a>
</div>
<div class="card">
  <div class="card-body">
    <form method="post">{% csrf_token %}{% include 'core/_form_fields.html' with form=form %}
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">{% if object %}Update{% else %}Create{% endif %} Cart</button>
        <a href="{% url 'core:cart_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
