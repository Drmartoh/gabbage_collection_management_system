{% extends "base.html" %}
{% block title %}Delete Ward{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-body text-center p-4">
        <div class="text-danger mb-3"><i class="bi bi-exclamation-triangle display-4"></i></div>
        <h4 class="fw-bold">Delete Ward</h4>
        <p class="text-muted">Are you sure you want to delete <strong>{{ ward.name }}</strong>? This will also delete all zones and routes in this ward.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'core:ward_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
