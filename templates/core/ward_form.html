{% extends "base.html" %}
{% block title %}{% if object %}Edit Ward{% else %}Add Ward{% endif %}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
  <h1 class="page-title mb-0">
    <i class="bi bi-geo-alt text-primary me-2"></i> {% if object %}Edit Ward{% else %}Add Ward{% endif %}
  </h1>
  <a href="{% url 'core:ward_list' %}" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-1"></i> Back to list</a>
</div>
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% include 'core/_form_fields.html' with form=form %}
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">{% if object %}Update{% else %}Create{% endif %} Ward</button>
        <a href="{% url 'core:ward_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
