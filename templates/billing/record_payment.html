{% extends "base.html" %}
{% block title %}Record payment{% endblock %}
{% block content %}
<h1 class="page-title"><i class="bi bi-cash-coin text-success me-2"></i> Record payment</h1>
<p class="text-muted mb-4">Bill: <strong>{{ bill.landlord.full_name }}</strong> · {{ bill.cycle }} · Balance: KES {{ bill.balance }}</p>
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">Amount (KES)</label>
        <input type="number" name="amount" class="form-control" step="0.01" min="0.01" placeholder="0" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Method</label>
        <select name="method" class="form-select">
          <option value="mpesa">M-Pesa</option>
          <option value="bank">Bank Transfer</option>
          <option value="cash">Cash</option>
          <option value="cheque">Cheque</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold">Reference (optional)</label>
        <input type="text" name="reference" class="form-control" placeholder="e.g. receipt number">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Record payment</button>
        <a href="{% url 'billing:bill_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
