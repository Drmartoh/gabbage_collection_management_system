{% extends "base.html" %}
{% block title %}Casual labourer{% endblock %}
{% block content %}
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
  <h1 class="page-title mb-0"><i class="bi bi-person-plus me-2"></i> Add or edit casual labourer</h1>
  <a href="{% url 'collections:labourer_list' %}" class="btn btn-outline-primary">Back</a>
</div>
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'collections:labourer_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
