{% extends "base.html" %}
{% block title %}Verify collection{% endblock %}
{% block content %}
<h1 class="page-title"><i class="bi bi-patch-check text-success me-2"></i> Verify collection</h1>
<p class="text-muted mb-4">Property: <strong>{{ record.property.name }}</strong> · Collected at: {{ record.collected_at|default:"—" }}</p>
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label fw-bold">Verification notes</label>
        <textarea name="verification_notes" class="form-control" rows="3" placeholder="Optional notes..."></textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i> Verify</button>
        <a href="{% url 'collections:assignment_list' %}" class="btn btn-outline-secondary">Back</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
