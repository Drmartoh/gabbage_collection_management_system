{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-11 col-md-8 col-lg-6 text-center">
    <div class="card">
      <div class="card-body p-5">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size:4rem"></i>
        <h1 class="h3 fw-bold mt-3">Page not found</h1>
        <p class="text-muted mb-4">The page you’re looking for doesn’t exist or has been moved.</p>
        <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-primary">Go to dashboard</a>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary ms-2">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
