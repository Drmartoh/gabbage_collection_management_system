{% extends "base.html" %}
{% block title %}Delete incident{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-danger"><div class="card-body text-center p-4">
<h4>Delete incident</h4>
<p>Delete "{{ incident.title }}"?</p>
<form method="post">{% csrf_token %}
<button type="submit" class="btn btn-danger">Yes, delete</button>
<a href="{% url 'incidents:incident_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div></div>
</div></div>
{% endblock %}
